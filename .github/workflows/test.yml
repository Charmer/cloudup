name: Test

# Reusable workflow: the actual gofmt/vet/test/frontend-build gate, called
# by both ci.yml (every push to master + every PR) and release.yml (before
# spending CI minutes on a five-platform build matrix). Kept in one place
# so a change here doesn't need to be kept in sync across two files.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -l . | tee /tmp/fmt.out; test ! -s /tmp/fmt.out
      - run: go vet ./...
      - run: go test ./... -count=1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
